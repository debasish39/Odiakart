<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile / PWA viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Browser supports Light + Dark themes -->
    <meta name="color-scheme" content="light dark" />

    <!-- SEO -->
    <title>Odikart | Smart Online Shopping</title>

    <meta
      name="description"
      content="Odikart is a modern online shopping platform for fashion, electronics, groceries, home essentials, and more. Discover products, great deals, secure payments, and convenient delivery."
    />

    <meta
      name="keywords"
      content="Odikart, online shopping, ecommerce, fashion, electronics, groceries, home essentials, India, shopping app, online store"
    />

    <meta
      name="author"
      content="Odikart"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/odikart.png"
      type="image/png"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Slick Carousel -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick-theme.min.css"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Odikart | Smart Online Shopping"
    />

    <meta
      property="og:description"
      content="Discover fashion, electronics, groceries, home essentials, and more on Odikart. Shop smarter with secure payments and convenient delivery."
    />

    <meta
      property="og:image"
      content="https://odikart.in/og-image.png"
    />

    <meta
      property="og:url"
      content="https://odikart.in"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Odikart"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Odikart | Smart Online Shopping"
    />

    <meta
      name="twitter:description"
      content="Shop smarter with Odikart. Discover great products, secure payments, and convenient delivery."
    />

    <meta
      name="twitter:image"
      content="https://odikart.in/og-image.png"
    />

    <!-- ========================================================= -->
    <!-- ODikart Browser / PWA Theme -->
    <!-- ========================================================= -->

    <!-- Light Mode -->
    <meta
      name="theme-color"
      content="#4F46E5"
      media="(prefers-color-scheme: light)"
    />

    <!-- Dark Mode -->
    <meta
      name="theme-color"
      content="#312E81"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Windows / Microsoft -->
    <meta
      name="msapplication-TileColor"
      content="#4F46E5"
    />

    <!-- PWA -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Odikart"
    />
  </head>

  <body class="font-[Poppins] bg-gray-50 text-gray-900 antialiased">

    <!-- React Application -->
    <div id="root"></div>

    <!-- React Entry -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>

    <!-- ========================================================= -->
    <!-- Razorpay -->
    <!-- Uncomment when Razorpay checkout is required -->
    <!-- ========================================================= -->

    <!--
    <script
      src="https://checkout.razorpay.com/v1/checkout.js"
    ></script>
    -->

  </body>
</html>
