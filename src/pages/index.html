<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>
      Odikart | Online Shopping Platform
    </title>

    <meta
      name="description"
      content="Odikart is your trusted online shopping destination for fashion, electronics, groceries, home essentials, and more. Fast delivery and secure payments."
    />

    <meta
      name="keywords"
      content="Odikart, online shopping, ecommerce, fashion, electronics, groceries, India, shopping app"
    />

    <meta
      name="author"
      content="Odikart"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/odikart.png"
      type="image/png"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Slick Carousel -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick-theme.min.css"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Odikart | Online Shopping Platform"
    />

    <meta
      property="og:description"
      content="Shop fashion, electronics, groceries and more with secure payments and fast delivery."
    />

    <meta
      property="og:image"
      content="https://odikart.in/og-image.png"
    />

    <meta
      property="og:url"
      content="https://odikart.in"
    />
    <meta
      property="og:type"
      content="website"
    />
    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:title"
      content="Odikart | Online Shopping Platform"
    />

    <meta
      name="twitter:description"
      content="Discover amazing deals on Odikart with secure checkout and fast delivery."
    />

    <meta
      name="twitter:image"
      content="https://odikart.in/og-image.png"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#4F46E5"
    />
  </head>

  <body class="font-[Poppins] bg-gray-50 text-gray-900 antialiased">
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

    <!-- <script src="https://checkout.razorpay.com/v1/checkout.js"></script> -->
  </body>
</html>
